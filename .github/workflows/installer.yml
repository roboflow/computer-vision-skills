name: installer

on:
  push:
    branches: [main, installer]
    paths:
      - 'installer/**'
      - 'tests/bats/**'
      - 'tests/pester/**'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'tests/bats/**'
      - 'tests/pester/**'
      - '.github/workflows/installer.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck -x --severity=warning \
            installer/agents.sh \
            installer/main.sh \
            installer/lib/*.sh \
            installer/hosts/*.sh

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y bats
          else
            brew install bats-core
          fi
      - name: Run bats tests
        env:
          NO_COLOR: "1"
        run: bats tests/bats/

  pester:
    strategy:
      fail-fast: false
      matrix:
        # `pwsh` exercises PowerShell 7+ on every OS (Linux/macOS/Windows).
        # `powershell` exercises Windows PowerShell 5.1 — that's the default
        # shell on a stock Windows box, and the one users get when they hit
        # the Start menu and type "PowerShell". We need both to pass.
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: macos-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber
          Get-Module -ListAvailable Pester | Select-Object -First 1 Name, Version
      - name: Run Pester tests
        shell: ${{ matrix.shell }}
        env:
          NO_COLOR: "1"
        run: |
          $result = Invoke-Pester -Path tests/pester/ -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
