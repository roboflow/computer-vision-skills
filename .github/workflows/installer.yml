name: installer

on:
  push:
    branches: [main, installer]
    paths:
      - 'agents.sh'
      - 'installer/**'
      - 'tests/bats/**'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'agents.sh'
      - 'installer/**'
      - 'tests/bats/**'
      - '.github/workflows/installer.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck -x --severity=warning \
            agents.sh \
            installer/main.sh \
            installer/lib/*.sh \
            installer/hosts/*.sh

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y bats
          else
            brew install bats-core
          fi
      - name: Run bats tests
        env:
          NO_COLOR: "1"
        run: bats tests/bats/
