name: Plugin releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ["plugin-v*", "chatgpt-v*"]

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Test release tooling
        run: python -m unittest discover -s release -p "test_*.py"
      - name: Check manifest versions
        run: python release/manage.py check
      - name: Require a version increase for shipped plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python release/manage.py check --base "$BASE"

  package:
    if: startsWith(github.ref, 'refs/tags/')
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Verify release commit and tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python release/manage.py check-tag "$TAG"
      - name: Build Claude and Codex release
        if: startsWith(github.ref_name, 'plugin-v')
        env:
          TAG: ${{ github.ref_name }}
        run: python release/manage.py build "$TAG"
      - name: Test and build ChatGPT release
        if: startsWith(github.ref_name, 'chatgpt-v')
        run: |
          python -m unittest discover -s chatgpt -p "test_*.py"
          python chatgpt/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/build/*.zip
            release/build/*.provenance.json
            chatgpt/build/*.zip
            chatgpt/build/*.provenance.json

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: artifacts
      - name: Create draft release with ZIP and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "$TAG" "${files[@]}" --verify-tag --draft --title "$TAG" --notes "Built from tag $TAG. See the attached provenance for the source commit and package checksum. ChatGPT packages still require dashboard upload and review."
