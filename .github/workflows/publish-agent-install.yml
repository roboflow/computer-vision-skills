name: Publish agent-install

# Publishes the user-facing install bootstraps to
# https://repo.roboflow.com/agent-install/{agent.sh,agent.ps1}
#
# Source of truth in this repo:
#   installer/agents.sh   -> published as agent.sh   (singular, per bucket convention)
#   installer/agents.ps1  -> published as agent.ps1
#
# The renamed copies are staged in ./staged/ so the upload action's parent: false
# semantics drop them under their published names. We keep the plural agents.{sh,ps1}
# names internally because every doc, test, and per-agent guide already uses them.

on:
  push:
    branches: [main]
    paths:
      - "installer/agents.sh"
      - "installer/agents.ps1"
      - ".github/workflows/publish-agent-install.yml"
  workflow_dispatch: {}

# Least-privilege at the workflow level. id-token is required for WIF;
# contents: read is enough for actions/checkout.
permissions:
  contents: read
  id-token: write

# One publish at a time, never cancel an in-flight upload.
concurrency:
  group: publish-agent-install
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requiring an environment lets us add manual approval / restrict to main
    # via the repo's environment protection rules without touching this file.
    environment: agent-install-prod
    env:
      BUCKET_NAME: roboflow-platform-agent-install
      PROJECT: roboflow-platform
      OIDC_PROJECT_ID: "481589474394"
      SERVICE_ACCOUNT: gha-computer-vision-skills
      WIF_POOL_ID: github-actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage installer scripts under their published names
        run: |
          mkdir -p staged
          cp installer/agents.sh  staged/agent.sh
          cp installer/agents.ps1 staged/agent.ps1
          ls -la staged/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.OIDC_PROJECT_ID }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/github
          service_account: ${{ env.SERVICE_ACCOUNT }}@${{ env.PROJECT }}.iam.gserviceaccount.com

      - name: Upload agent.sh
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          parent: false
          path: staged/agent.sh
          destination: ${{ env.BUCKET_NAME }}/
          process_gcloudignore: false
          headers: |-
            content-type: text/x-shellscript; charset=utf-8
            cache-control: no-cache, max-age=0

      - name: Upload agent.ps1
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          parent: false
          path: staged/agent.ps1
          destination: ${{ env.BUCKET_NAME }}/
          process_gcloudignore: false
          headers: |-
            content-type: text/plain; charset=utf-8
            cache-control: no-cache, max-age=0
